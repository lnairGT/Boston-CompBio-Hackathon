[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indication2binder"
version = "0.1.0"
description = "Indication to binder-design pipeline: rank targets, gate on experimental complexes, extract epitopes, emit BindCraft2 specs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "biopython>=1.83",
    "gemmi>=0.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ind2b = "ind2b.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ind2b = ["data/*.json"]
